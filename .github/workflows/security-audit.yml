name: Dependency Security Audit

on:
  push:
    branches: [chore/dependency-security-audit]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies and generate lockfile
        run: npm install
      - name: Commit generated lockfile when running on a same-repository pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if [ -f package-lock.json ] && ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: commit npm lockfile"
            git push origin "HEAD:refs/heads/${GITHUB_HEAD_REF}"
          fi
      - name: Run npm audit
        shell: bash
        run: |
          npm audit --json > npm-audit-report.json || audit_exit=$?
          echo "${audit_exit:-0}" > npm-audit-exit-code.txt
          node -e "const r=require('./npm-audit-report.json'); console.log(JSON.stringify({metadata:r.metadata?.vulnerabilities, advisories:Object.entries(r.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{name:x.name,title:x.title,url:x.url,range:x.range})}))},null,2))"
      - name: Upload audit report and generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-audit
          path: |
            npm-audit-report.json
            npm-audit-exit-code.txt
            package-lock.json
          if-no-files-found: warn
          retention-days: 14
